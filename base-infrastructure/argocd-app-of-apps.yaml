apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    directory:
      exclude: 'archived/**'
      jsonnet: {}
      recurse: true
    path: base-infrastructure/argocd
    repoURL: https://github.com/IFRCGo/go-deploy-playground
    targetRevision: main
  destination:
    namespace: argocd-apps
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
