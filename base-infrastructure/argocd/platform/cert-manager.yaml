apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      valuesObject:
        crds:
          enabled: true
        webhook:
          validatingWebhookConfiguration:
            namespaceSelector:
              matchExpressions:
                - key: cert-manager.io/disable-validation
                  operator: NotIn
                  values:
                    - "true"
                # NOTE: these are added by AKS - adding here to avoid out-of-sync issue in argocd
                - key: control-plane
                  operator: NotIn
                  values:
                    - "true"
                - key: kubernetes.azure.com/managedby
                  operator: NotIn
                  values:
                    - aks
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
